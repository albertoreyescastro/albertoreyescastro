<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Alberto Reyes Castro — Applied AI Engineer</title>
  <desc id="desc">Custom profile banner highlighting reliable AI systems, multimodal machine learning, agent orchestration and scientific computing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#0a1d20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e0cf"/>
      <stop offset="1" stop-color="#9cc5ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(64 58)">
    <text x="0" y="0" fill="#8fa7bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">ALBERTO REYES CASTRO  /  LONDON, UK</text>
    <text x="0" y="67" fill="#f5f8fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">Applied AI Engineer</text>
    <text x="0" y="112" fill="#bed0df" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21">Physics → machine learning → reliable AI systems</text>
    <rect x="0" y="142" width="590" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="183" fill="#d9e4ec" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Multimodal ML  •  on-device inference  •  agent orchestration</text>
    <text x="0" y="212" fill="#d9e4ec" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">evaluation  •  scientific computing  •  human-gated automation</text>
  </g>

  <g transform="translate(760 58)">
    <rect x="0" y="0" width="372" height="244" rx="22" fill="#07111f" fill-opacity="0.76" stroke="#90a9bd" stroke-opacity="0.18"/>
    <text x="24" y="33" fill="#8099ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4">ENGINEERING LOOP</text>

    <g transform="translate(30 72)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <rect x="0" y="0" width="80" height="44" rx="10" fill="#0d2830" stroke="#68e0cf" stroke-opacity="0.65"/>
      <text x="40" y="27" text-anchor="middle" fill="#d8fff7">MODEL</text>

      <path d="M86 22H128" stroke="#68e0cf" stroke-width="2" stroke-opacity="0.7"/>
      <circle cx="130" cy="22" r="3" fill="#68e0cf" filter="url(#softGlow)"/>

      <rect x="136" y="0" width="80" height="44" rx="10" fill="#102238" stroke="#9cc5ff" stroke-opacity="0.65"/>
      <text x="176" y="27" text-anchor="middle" fill="#e4efff">ROUTE</text>

      <path d="M222 22H264" stroke="#9cc5ff" stroke-width="2" stroke-opacity="0.7"/>
      <circle cx="266" cy="22" r="3" fill="#9cc5ff" filter="url(#softGlow)"/>

      <rect x="272" y="0" width="70" height="44" rx="10" fill="#171f31" stroke="#c4b5fd" stroke-opacity="0.65"/>
      <text x="307" y="27" text-anchor="middle" fill="#eee9ff">CHECK</text>

      <path d="M307 50V81H176" fill="none" stroke="#71859a" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="176" cy="81" r="3" fill="#71859a"/>

      <rect x="102" y="92" width="148" height="48" rx="11" fill="#18251f" stroke="#a7f3d0" stroke-opacity="0.55"/>
      <text x="176" y="121" text-anchor="middle" fill="#e5fff2">HUMAN GATE</text>
    </g>

    <text x="24" y="226" fill="#70889a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">capability · evidence · recovery · authority</text>
  </g>
</svg>
